<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamerLink - Marketplace & Services au Cameroun</title>
    <!-- Intégration de Tailwind CSS pour un design moderne et professionnel -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- En-tête / Navigation -->
    <header class="bg-blue-700 text-white px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-40">
      <div class="flex items-center space-x-1">
        <span class="text-xl font-extrabold tracking-tight">Camer<span class="text-yellow-400">Link</span></span>
      </div>
      
      <!-- Bouton d'ouverture de la modale de publication -->
      <button id="open-modal-btn" class="bg-yellow-400 hover:bg-yellow-300 text-blue-950 font-bold px-4 py-2 rounded-full text-xs shadow transition">
        + Publier une annonce
      </button>
    </header>

    <!-- Corps principal -->
    <main>
      <!-- Section Hero (Mise en avant et recherche) -->
      <section class="bg-gradient-to-b from-blue-700 to-blue-600 text-white px-4 pt-5 pb-8">
        
        <!-- Badge de positionnement pays -->
        <div class="flex justify-center mb-3">
          <span class="inline-flex items-center gap-1.5 bg-blue-800/60 border border-blue-400/30 text-blue-100 text-xs px-3 py-1 rounded-full backdrop-blur-md">
            🇨🇲 La marketplace de référence au Cameroun
          </span>
        </div>

        <!-- Titre & Proposition de valeur -->
        <div class="text-center mb-5">
          <h1 class="text-xl font-bold leading-snug mb-1">
            Tout ce dont vous avez besoin, <span class="text-yellow-400">au même endroit.</span>
          </h1>
          <p class="text-blue-100 text-xs px-2">
            Trouvez des produits, des professionnels et des services vérifiés près de chez vous.
          </p>
        </div>

        <!-- Boîte de recherche moderne et "Flottante" -->
        <div class="bg-white rounded-2xl shadow-xl p-3 text-gray-800 max-w-md mx-auto">
          
          <!-- Champ de recherche textuel -->
          <div class="relative mb-2">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">🔍</span>
            <input 
              type="search" 
              id="search-input" 
              placeholder="Ex: Toyota, dépannage, immobilier..." 
              class="w-full pl-9 pr-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Sélecteur de ville -->
          <div class="relative mb-3">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">📍</span>
            <select 
              id="city-select" 
              class="w-full pl-9 pr-8 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-white"
            >
              <option value="">Toutes les villes</option>
              <option value="Yaoundé">Yaoundé</option>
              <option value="Douala">Douala</option>
              <option value="Bafoussam">Bafoussam</option>
              <option value="Garoua">Garoua</option>
            </select>
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400 text-xs">▼</span>
          </div>

          <!-- Bouton de recherche -->
          <button 
            id="search-btn" 
            class="w-full bg-yellow-400 hover:bg-yellow-500 text-blue-950 font-bold py-2.5 rounded-xl shadow text-xs transition"
          >
            Rechercher
          </button>
        </div>

      </section>

      <!-- Section d'affichage dynamique des annonces -->
      <section class="px-4 py-6 max-w-4xl mx-auto">
        <h2 class="text-sm font-bold text-gray-700 mb-4">Annonces récentes</h2>
        <div id="listings-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Les cartes d'annonces s'afficheront ici automatiquement via votre script -->
        </div>
      </section>
    </main>

    <!-- Modale de publication d'annonce -->
    <div id="ad-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" style="display: none;">
      <div class="bg-white rounded-2xl p-5 w-full max-w-md shadow-2xl max-h-[90vh] overflow-y-auto">
        <h2 class="text-base font-bold text-gray-800 mb-4">Publier une nouvelle annonce</h2>
        
        <form id="ad-form" class="space-y-3">
          <div>
            <input type="text" id="ad-title" placeholder="Titre de l'annonce" required class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <select id="ad-category" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="vehicules">Véhicules</option>
              <option value="immobilier">Immobilier</option>
              <option value="services">Services</option>
            </select>
          </div>

          <div>
            <select id="ad-city" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="Yaoundé">Yaoundé</option>
              <option value="Douala">Douala</option>
              <option value="Bafoussam">Bafoussam</option>
              <option value="Garoua">Garoua</option>
            </select>
          </div>

          <div>
            <input type="text" id="ad-price" placeholder="Prix (ex: 50 000 FCFA)" required class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <textarea id="ad-desc" placeholder="Description de l'annonce..." rows="4" required class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>

          <div class="flex justify-end space-x-2 pt-2">
            <button type="button" id="close-modal-btn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl text-xs font-semibold transition">
              Annuler
            </button>
            <button type="submit" class="px-4 py-2 bg-yellow-400 hover:bg-yellow-500 text-blue-950 rounded-xl text-xs font-bold shadow transition">
              Publier
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Script JavaScript existant -->
    <script src="script.js"></script>
</body>
</html>
