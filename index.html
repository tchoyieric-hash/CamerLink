<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamerLink - Marketplace Locale</title>
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- En-tête -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">📦 CamerLink</h1>
            <button onclick="openModal()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold text-sm shadow hover:bg-blue-50 transition">
                + Publier une annonce
            </button>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Annonces récentes</h2>
            <p class="text-sm text-gray-500">Trouvez les meilleures offres près de chez vous au Cameroun.</p>
        </div>

        <!-- Grille des annonces (ID corrigé en 'listingsGrid') -->
        <div id="listingsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Les annonces seront injectées ici dynamiquement par JavaScript -->
            <p class="text-gray-500 col-span-full text-center py-10">Chargement des annonces...</p>
        </div>
    </main>

    <!-- Modal / Formulaire de Publication -->
    <div id="adModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Publier une nouvelle annonce</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <form id="adForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Titre de l'annonce</label>
                    <input type="text" id="adTitle" required placeholder="Ex: iPhone 13 Pro Max" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="adDescription" required rows="3" placeholder="État, lieu de récupération..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prix (FCFA)</label>
                    <input type="number" id="adPrice" required placeholder="Ex: 350000" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Champ Lien de l'image (URL) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Lien de l'image (URL)</label>
                    <input type="url" id="adImage" placeholder="https://exemple.com/image.jpg" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <p class="text-xs text-gray-400 mt-1">Collez un lien direct vers une image en ligne.</p>
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">Annuler</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">Publier</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Pied de page -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500">
        &copy; 2026 CamerLink - Conçu pour le Cameroun 🇨🇲
    </footer>

    <!-- Script de gestion -->
    <script src="script.js"></script>
</body>
</html>
