<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>CamerLink - La marketplace pensée pour le Cameroun</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI',Roboto,Arial,sans-serif
    }

    body{
      background:#f8fafc;
      color:#0f172a;
      line-height:1.5
    }

    .hidden{
      display:none!important
    }

    header{
      background:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 20px;
      box-shadow:0 1px 8px rgba(15,23,42,.06);
      position:sticky;
      top:0;
      z-index:50
    }

    .logo{
      font-size:1.35rem;
      font-weight:800;
      color:#2563eb
    }

    .logo span{
      color:#16a34a
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px
    }

    .btn{
      border:1px solid #cbd5e1;
      background:#fff;
      border-radius:999px;
      padding:10px 16px;
      font-weight:700;
      cursor:pointer;
      font-size:.9rem
    }

    .btn-primary{
      background:#2563eb;
      color:#fff;
      border-color:#2563eb
    }

    .btn-primary:hover{
      background:#1d4ed8
    }

    .btn-success{
      background:#16a34a;
      color:#fff;
      border-color:#16a34a
    }

    .btn-danger{
      background:#fff;
      color:#dc2626;
      border-color:#fecaca
    }

    .account-menu{
      position:absolute;
      right:16px;
      top:68px;
      background:#fff;
      width:240px;
      border:1px solid #e2e8f0;
      border-radius:16px;
      box-shadow:0 18px 50px rgba(15,23,42,.16);
      padding:10px;
      z-index:80
    }

    .account-phone{
      padding:10px 12px;
      border-bottom:1px solid #e2e8f0;
      margin-bottom:6px;
      color:#64748b;
      font-size:.82rem
    }

    .account-menu button{
      width:100%;
      text-align:left;
      border:0;
      background:#fff;
      padding:12px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer
    }

    .account-menu button:hover{
      background:#f1f5f9
    }

    .hero{
      background:#2563eb;
      color:#fff;
      text-align:center;
      padding:36px 18px 44px
    }

    .badge{
      display:inline-block;
      background:#1d4ed8;
      border-radius:999px;
      padding:8px 12px;
      font-weight:700;
      font-size:.82rem;
      margin-bottom:22px
    }

    .hero h1{
      font-size:2rem;
      line-height:1.15;
      font-weight:800
    }

    .hero h1 span{
      color:#fbbf24
    }

    .hero p{
      opacity:.92;
      margin:16px auto 18px;
      max-width:560px
    }

    .box{
      background:#fff;
      border-radius:22px;
      padding:12px;
      max-width:560px;
      margin:0 auto;
      display:grid;
      gap:9px;
      box-shadow:0 12px 30px rgba(15,23,42,.14)
    }

    input,select,textarea{
      width:100%;
      border:1px solid #cbd5e1;
      background:#f8fafc;
      border-radius:999px;
      padding:13px 14px;
      font-size:.95rem;
      outline:none
    }

    textarea{
      border-radius:16px;
      resize:vertical
    }

    input:focus,select:focus,textarea:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 3px rgba(37,99,235,.12)
    }

    .btn-search{
      background:#fbbf24;
      border:0;
      border-radius:999px;
      padding:13px;
      font-size:1rem;
      font-weight:800;
      cursor:pointer
    }

    main{
      max-width:1100px;
      margin:0 auto;
      padding:26px 16px 40px
    }

    .head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px
    }

    .head h2{
      font-size:1.15rem;
      color:#1e293b
    }

    .head a{
      color:#2563eb;
      font-weight:700;
      font-size:.85rem;
      cursor:pointer
    }

    #listings{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:18px
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:12px;
      box-shadow:0 5px 18px rgba(15,23,42,.08);
      overflow:hidden;
      display:flex;
      flex-direction:column
    }

    .card img{
      width:100%;
      height:190px;
      object-fit:cover;
      border-radius:14px;
      background:#e2e8f0
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:12px 0 7px
    }

    .cat{
      background:#eff6ff;
      color:#1d4ed8;
      border-radius:999px;
      padding:6px 9px;
      font-weight:800;
      font-size:.7rem;
      text-transform:uppercase
    }

    .ok{
      background:#f0fdf4;
      color:#16a34a;
      border-radius:8px;
      padding:5px 8px;
      font-weight:700;
      font-size:.7rem
    }

    .card h3{
      font-size:1.05rem;
      margin-bottom:6px
    }

    .desc{
      color:#64748b;
      font-size:.88rem;
      flex:1
    }

    .wa{
      display:block;
      color:#16a34a;
      font-weight:800;
      text-decoration:none;
      margin-top:9px
    }

    .foot{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-top:1px solid #e2e8f0;
      margin-top:10px;
      padding-top:10px
    }

    .city{
      color:#64748b;
      font-size:.8rem
    }

    .price{
      color:#2563eb;
      font-weight:800
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.62);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:100
    }

    .sheet{
      background:#fff;
      border-radius:24px;
      padding:24px;
      width:100%;
      max-width:470px;
      box-shadow:0 25px 80px rgba(0,0,0,.25);
      position:relative
    }

    .sheet.wide{
      max-width:560px
    }

      display:flex;
      justify-content:space-between;
      align-items
