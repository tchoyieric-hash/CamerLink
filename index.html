<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamerLink - Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <!-- Intégration de la bibliothèque Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="logo">Camer<span>Link</span></div>
        <nav>
            <a href="#categories">Catégories</a>
            <a href="#annonces">Annonces</a>
            <a href="#professionnels">Professionnels</a>
        </nav>
        <button class="btn-outline" id="open-modal-btn">Publier une annonce</button>
    </header>

    <main>
        <section class="hero">
            <div class="hero-copy">
                <div class="badge">🇨🇲 La marketplace pensée pour le Cameroun</div>
                <h1>Tout ce dont vous avez besoin, <span>au même endroit.</span></h1>
                <p>Trouvez des produits, des professionnels, des véhicules et des services près de chez vous !</p>

                <div class="search-box">
                    <input type="search" id="search-input" placeholder="Que recherchez-vous ? Ex: Toyota, dépannage, appartement...">
                    <select id="city-select">
                        <option value="">Toutes les villes</option>
                        <option value="Yaoundé">Yaoundé</option>
                        <option value="Douala">Douala</option>
                        <option value="Bafoussam">Bafoussam</option>
                        <option value="Garoua">Garoua</option>
                    </select>
                    <button class="btn" id="search-btn">Rechercher</button>
                </div>
            </div>
        </section>

        <!-- Section d'affichage dynamique des annonces -->
        <section class="listings-section" style="padding: 20px; max-width: 1300px; margin: 0 auto;">
            <h2>Annonces récentes</h2>
            <div id="listings-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
                <!-- Les cartes d'annonces s'afficheront ici automatiquement -->
            </div>
        </section>
    </main>

    <!-- Modal de publication d'annonce -->
    <div id="ad-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h2>Publier une nouvelle annonce</h2>
            <form id="ad-form" style="margin-top: 15px;">
                <input type="text" id="ad-title" placeholder="Titre de l'annonce" required style="width:100%; margin-bottom:12px; padding:10px; border:1px solid #ccc; border-radius:4px;">
                
                <select id="ad-category" style="width:100%; margin-bottom:12px; padding:10px; border:1px solid #ccc; border-radius:4px;">
                    <option value="vehicules">Véhicules</option>
                    <option value="immobilier">Immobilier</option>
                    <option value="services">Services</option>
                </select>
                
                <select id="ad-city" style="width:100%; margin-bottom:12px; padding:10px; border:1px solid #ccc; border-radius:4px;">
                    <option value="Yaoundé">Yaoundé</option>
                    <option value="Douala">Douala</option>
                    <option value="Bafoussam">Bafoussam</option>
                    <option value="Garoua">Garoua</option>
                </select>
                
                <input type="text" id="ad-price" placeholder="Prix (ex: 50 000 FCFA)" required style="width:100%; margin-bottom:12px; padding:10px; border:1px solid #ccc; border-radius:4px;">
                
                <textarea id="ad-desc" placeholder="Description de l'annonce..." rows="4" required style="width:100%; margin-bottom:15px; padding:10px; border:1px solid #ccc; border-radius:4px;"></textarea>
                
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="close-modal" style="background: #ccc; border: none; padding: 10px 15px; border-radius:4px; cursor: pointer;">Annuler</button>
                    <button type="submit" style="background: #ffc107; border: none; padding: 10px 20px; font-weight: bold; border-radius:4px; cursor: pointer;">Publier</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
