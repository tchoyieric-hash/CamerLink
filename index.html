<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CamerLink · La Super-App Immersive & Futuriste 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --accent: #f59e0b;
      --success: #10b981;
      --bg: #030712;
      --surface: #0f172a;
      --surface-glass: rgba(15, 23, 42, 0.85);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 36px;
      --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.9);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: rgba(0, 0, 0, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    .hidden { display: none !important; }

    header { background: var(--surface-glass); backdrop-filter: blur(20px); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
    .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo { font-size: 1.5rem; font-weight: 900; color: var(--text); }
    .logo span { color: var(--primary); }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-icon, .btn-login, .btn-user, .btn-pub { padding: 10px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); font-size: 0.9rem; }
    .btn-icon { background: var(--surface); color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .btn-login { background: transparent; color: var(--text); }
    .btn-user { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
    .btn-pub { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; border: none; font-weight: 800; }

    .hero { text-align: center; padding: 60px 20px 40px; border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 12px; }
    .hero h1 span { color: var(--accent); }
    .hero p { max-width: 600px; margin: 0 auto 24px; color: var(--text-muted); font-size: 1.1rem; }

    .search-box-container { max-width: 750px; margin: 0 auto; background: var(--surface); padding: 10px; border-radius: 30px; border: 1px solid var(--border); display: flex; gap: 10px; }
    .search-box-container input, .search-box-container select { flex: 1; background: transparent; border: none; padding: 12px 16px; color: var(--text); font-size: 1rem; outline: none; }
    .btn-search { background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 20px; font-weight: 800; cursor: pointer; }

    .categories-bar { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .cat-chip { background: var(--surface); border: 1px solid var(--border); padding: 10px 20px; border-radius: 999px; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    main { max-width: 1200px; margin: auto; padding: 20px 20px 80px; }
    
    #listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: var(--surface); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
    .card-img-wrapper { position: relative; width: 100%; height: 180px; background: #1e293b; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); color: white; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
    .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; flex-grow: 1; }
    .whatsapp-btn { display: block; text-align: center; background: #10b981; color: white; padding: 12px; border-radius: 12px; font-weight: 800; text-decoration: none; margin-bottom: 12px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; }
    .card-price { color: var(--primary); font-weight: 900; font-size: 1.1rem; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 2000; }
    .modal-sheet { background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius-lg); padding: 30px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.9rem; }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); font-size: 1rem; outline: none; }
    .btn-submit { width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: 900; border: none; cursor: pointer; margin-top: 10px; }

    footer { text-align: center; padding: 40px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 40px; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <a class="logo-container" href="index.html">
    <span class="logo">Camer<span>Link</span></span>
  </a>
  <div class="header-actions">
    <button class="btn-icon" onclick="toggleTheme()">🌓</button>
    <button id="loginBtn" class="btn-login" onclick="openAuthModal()">Connexion</button>
    <button id="userBtn" class="btn-user hidden" onclick="openUserModal()">Compte</button>
    <button class="btn-pub" onclick="openPublishModal()">+ Publier</button>
  </div>
</header>

<section class="hero">
  <h1>Le Futur du Cameroun <span>en direct.</span></h1>
  <p>Découvrez et publiez les meilleurs services, restaurants et articles du moment.</p>

  <div class="search-box-container">
    <input id="searchInput" type="search" placeholder="Rechercher une offre...">
    <select id="cityFilter">
      <option value="">Toutes les villes</option>
    </select>
    <button class="btn-search" onclick="loadListings()">Filtrer</button>
  </div>
</section>

<div class="categories-bar">
  <div class="cat-chip active" onclick="filterByCategory('', this)">✨ Tout voir</div>
  <div class="cat-chip" onclick="filterByCategory('Restaurants & Gastronomie', this)">🍽️ Restaurants</div>
  <div class="cat-chip" onclick="filterByCategory('Écoles & Formations', this)">🎓 Écoles</div>
  <div class="cat-chip" onclick="filterByCategory('Services & Artisans', this)">🛠️ Services</div>
  <div class="cat-chip" onclick="filterByCategory('Véhicules', this)">🚗 Véhicules</div>
</div>

<main>
  <div id="listings">
    <div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">
      <p>Chargement des offres en cours...</p>
    </div>
  </div>
</main>

<!-- MODAL PUBLICATION -->
<div id="publishModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3>Publier une annonce</h3>
      <button onclick="closePublishModal()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">×</button>
    </div>
    <form id="adForm" onsubmit="handlePublishSubmit(event)">
      <div class="form-group">
        <label>Catégorie</label>
        <select class="form-control" id="adCategory">
          <option value="Restaurants & Gastronomie">Restaurants & Gastronomie</option>
          <option value="Écoles & Formations">Écoles & Formations</option>
          <option value="Services & Artisans">Services & Artisans</option>
          <option value="Véhicules">Véhicules</option>
          <option value="Autres">Autres</option>
        </select>
      </div>
      <div class="form-group">
        <label>Titre</label>
        <input class="form-control" id="adTitle" required placeholder="Ex: Restaurant Le Gourmet">
      </div>
      <div class="form-group">
        <label>Ville</label>
        <select class="form-control" id="adCity"></select>
      </div>
      <div class="form-group">
        <label>Prix (FCFA)</label>
        <input class="form-control" id="adPrice" type="number" required placeholder="15000">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" id="adDescription" rows="3" required placeholder="Détails de l'offre..."></textarea>
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input class="form-control" id="adContact" type="tel" required placeholder="6XXXXXXXX">
      </div>
      <button class="btn-submit" type="submit">Valider la publication</button>
    </form>
  </div>
</div>

<!-- MODAL AUTH -->
<div id="authModal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3>Connexion Pro</h3>
      <button onclick="closeAuthModal()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">×</button>
    </div>
    <form onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label>Téléphone (9 chiffres)</label>
        <input class="form-control" id="authPhone" type="tel" maxlength="9" required placeholder="6XXXXXXXX">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input class="form-control" id="authPassword" type="password" required placeholder="Mot de passe">
      </div>
      <button class="btn-submit" type="submit">Se connecter / S'inscrire</button>
    </form>
    <p id="authErrorMsg" style="color:#ef4444; text-align:center; margin-top:10px; font-size:0.9rem;"></p>
  </div>
</div>

<footer>
  <p>© 2026 CamerLink · Tous droits réservés</p>
</footer>

<script>
  const SUPABASE_URL = 'https://lviddipduhaelxcvyykc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_j0C8eL1g6hgAcnL4gU_zRg_jvi0bmYH';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CITIES = ['Douala', 'Yaoundé', 'Bafoussam', 'Garoua', 'Bamenda', 'Kribi'];
  let currentCategory = '';
  let currentUser = null;

  const $ = id => document.getElementById(id);

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('camerlink_theme', next);
  }
  if(localStorage.getItem('camerlink_theme')) document.documentElement.setAttribute('data-theme', localStorage.getItem('camerlink_theme'));

  const openPublishModal = () => {
    if (!currentUser) { openAuthModal(); return; }
    $('publishModal').classList.remove('hidden');
  };
  const closePublishModal = () => $('publishModal').classList.add('hidden');
  const openAuthModal = () => $('authModal').classList.remove('hidden');
  const closeAuthModal = () => $('authModal').classList.add('hidden');

  async function handleAuthSubmit(e) {
    e.preventDefault();
    const phone = $('authPhone').value.trim();
    const password = $('authPassword').value;
    const email = `237${phone}@camerlink.app`;
    
    let res = await supabaseClient.auth.signInWithPassword({ email, password });
    if (res.error) {
      res = await supabaseClient.auth.signUp({ email, password });
    }
    if (res.error) {
      $('authErrorMsg').textContent = "Erreur d'authentification.";
    } else {
      closeAuthModal();
      checkSession();
      loadListings();
    }
  }

  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data?.session?.user || null;
    $('loginBtn').classList.toggle('hidden', !!currentUser);$('userBtn').classList.toggle('hidden', !currentUser);
  }

  async function handlePublishSubmit(e) {
    e.preventDefault();
    if (!currentUser) return;

    const { error } = await supabaseClient.from('annonces').insert([{
      title: $('adTitle').value.trim(),
      category: $('adCategory').value,
      city: $('adCity').value,
      price: parseFloat($('adPrice').value),
      description: $('adDescription').value.trim(),
      contact: $('adContact').value.trim(),
      user_id: currentUser.id
    }]);

    if (!error) {
      $('adForm').reset();
      closePublishModal();
      loadListings();
    } else {
      alert("Erreur lors de la publication.");
    }
  }

  async function loadListings() {
    const container = $('listings');
    const query = $('searchInput').value.trim();
    const city = $('cityFilter').value;

    let req = supabaseClient.from('annonces').select('*').order('created_at', { ascending: false });
    if (city) req = req.eq('city', city);
    if (currentCategory) req = req.eq('category', currentCategory);
    if (query) req = req.or(`title.ilike.%${query}%,description.ilike.%${query}%`);

    const { data, error } = await req;
    if (error || !data || data.length === 0) {
      container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);"><p>Aucune annonce trouvée.</p></div>`;
      return;
    }

    container.innerHTML = data.map(item => {
      let img = 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80';
      if (item.category === 'Restaurants & Gastronomie') img = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=500&q=80';
      else if (item.category === 'Véhicules') img = '
