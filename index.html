<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CamerLink · La Super-App Immersive & Futuriste 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --accent: #f59e0b;
      --success: #10b981;
      --bg: #030712;
      --surface: #0f172a;
      --surface-glass: rgba(15, 23, 42, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 36px;
      --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.15);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.85);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 10px 30px rgba(15, 23, 42, 0.06);
      --shadow-glow: 0 0 40px rgba(37, 99, 235, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; transition: background 0.4s ease, color 0.4s ease; overflow-x: hidden; }
    .hidden { display: none !important; }

    /* HEADER FUTURISTE */
    header { background: var(--surface-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
    .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-pulse { width: 12px; height: 12px; background: var(--success); border-radius: 50%; box-shadow: 0 0 15px var(--success); animation: neonPulse 2s infinite; }
    @keyframes neonPulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); } 70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    .logo { font-size: 1.6rem; font-weight: 900; color: var(--text); letter-spacing: -1px; }
    .logo span { background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .btn-icon { background: var(--surface); border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; color: var(--text); transition: all 0.3s; }
    .btn-icon:hover { transform: scale(1.1); border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
    .btn-login { background: transparent; color: var(--text); padding: 10px 20px; border-radius: 999px; border: 1px solid var(--border); font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .btn-login:hover { border-color: var(--primary); color: var(--primary); }
    .btn-user { background: rgba(59, 130, 246, 0.15); color: var(--primary); padding: 10px 20px; border-radius: 999px; font-weight: 700; cursor: pointer; border: 1px solid rgba(59,130,246,0.3); }
    .btn-pub { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; padding: 12px 24px; border-radius: 999px; font-weight: 800; box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); border: none; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
    .btn-pub:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(59, 130, 246, 0.6); }

    /* HERO IMMERSIF */
    .hero { background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.25), transparent 60%), var(--bg); text-align: center; padding: 75px 20px 60px; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(59, 130, 246, 0.1); backdrop-filter: blur(12px); padding: 8px 20px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; margin-bottom: 24px; border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary); box-shadow: 0 0 20px rgba(59,130,246,0.15); }
    .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 16px; letter-spacing: -1.5px; line-height: 1.1; }
    .hero h1 span { background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { max-width: 700px; margin: 0 auto 36px; color: var(--text-muted); font-size: 1.15rem; font-weight: 500; }

    /* BARRE DE RECHERCHE FUTURISTE */
    .search-box-container { max-width: 840px; margin: 0 auto; background: var(--surface-glass); backdrop-filter: blur(30px); padding: 12px; border-radius: 40px; border: 1px solid var(--border); box-shadow: var(--shadow-sm), var(--shadow-glow); display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-inputs { display: grid; grid-template-columns: 1.6fr 1.2fr; gap: 10px; }
    .search-input-wrap, .search-select-wrap { position: relative; display: flex; align-items: center; }
    .search-input-wrap input, .search-select-wrap select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 30px; padding: 16px 20px 16px 50px; font-size: 1rem; color: var(--text); outline: none; font-weight: 600; transition: border-color 0.3s; }
    .search-input-wrap input:focus, .search-select-wrap select:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
    .search-input-wrap::before { content: '🔍'; position: absolute; left: 20px; font-size: 1.1rem; }
    .search-select-wrap::before { content: '📍'; position: absolute; left: 20px; font-size: 1.1rem; }
    .search-select-wrap select { padding-left: 50px; cursor: pointer; appearance: none; }
    .btn-search { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 16px 36px; border-radius: 30px; font-weight: 800; border: none; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 8px 25px rgba(59,130,246,0.4); }
    .btn-search:hover { transform: scale(1.03); }

    /* FILTRES CATÉGORIES */
    .categories-bar { max-width: 1250px; margin: 30px auto 10px; padding: 0 24px; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-chip { background: var(--surface); border: 1px solid var(--border); padding: 12px 22px; border-radius: 999px; font-size: 0.9rem; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.3s; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 8px; }
    .cat-chip.active, .cat-chip:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-2px); }

    main { max-width: 1250px; margin: auto; padding: 20px 24px 100px; }

    /* SECTION REELS VIDÉO IMMERSIFS */
    .reels-section { margin: 40px 0 50px; }
    .reels-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .reels-header h2 { font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
    .reels-container { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
    .reels-container::-webkit-scrollbar { display: none; }
    
    .reel-card { min-width: 220px; height: 360px; background: #000; border-radius: var(--radius-md); overflow: hidden; position: relative; cursor: pointer; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s; flex-shrink: 0; }
    .reel-card:hover { transform: scale(1.05) translateY(-5px); box-shadow: 0 20px 40px rgba(59,130,246,0.3); border-color: var(--primary); }
    .reel-card video, .reel-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: transform 0.5s; }
    .reel-card:hover img { transform: scale(1.1); }
    .reel-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2) 30%, rgba(3,7,18,0.95) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; color: white; }
    .reel-author { font-size: 0.8rem; font-weight: 700; color: #60a5fa; margin-bottom: 4px; }
    .reel-title { font-size: 0.95rem; font-weight: 800; line-height: 1.35; }
    .live-badge-tag { position: absolute; top: 14px; left: 14px; background: rgba(220, 38, 38, 0.9); backdrop-filter: blur(8px); color: white; padding: 5px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.5px; box-shadow: 0 0 15px rgba(220,38,38,0.5); animation: neonPulse 1.5s infinite; }

    /* MODALE LECTEUR VIDÉO PLEIN ÉCRAN (REELS) */

    .reel-player-content { width: 100%; max-width: 420px; height: 80vh; background: #000; border-radius: var(--radius-lg); overflow: hidden; position: relative; box-shadow: 0 0 60px rgba(59,130,246,0.3); border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: flex-end; }
    .reel-player-content img, .reel-player-content video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .reel-player-overlay { position: relative; z-index: 2; padding: 30px; background: linear-gradient(180deg, transparent 40%, rgba(3,7,18,0.95) 100%); color: white; }
    .close-reel-btn { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* GRILLE DE CARTES SPECTACULAIRE */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin: 40px 0 24px; }
    .section-header h2 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; }
    .section-header a { color: var(--primary); font-weight: 800; text-decoration: none; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
    .section-header a:hover { opacity: 0.8; }

    #listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }
    
    .card { background: var(--surface); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s, border-color 0.4s; display: flex; flex-direction: column; position: relative; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 30px rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); }

    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .card:hover img { transform: scale(1.08); }
